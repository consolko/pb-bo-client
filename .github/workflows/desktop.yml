name: Desktop checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake ninja-build python3 zlib1g-dev qt6-base-dev qt6-declarative-dev qt6-l10n-tools qt6-svg-plugins libqt6sql6-sqlite qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tested sources
        run: |
          mkdir -p artifacts
          git -c safe.directory="$GITHUB_WORKSPACE" archive --format=tar HEAD -o artifacts/source.tar
      - name: Configure and build
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBOOKORBIT_CHECKS=ON 2>&1 | tee artifacts/configure.log
          cmake --build build/desktop -j2 2>&1 | tee artifacts/build.log
      - name: Run tests
        run: ctest --test-dir build/desktop --output-on-failure --no-tests=error
      - name: Preserve exact sources and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-checks-${{ github.sha }}
          path: |
            artifacts/
            build/desktop/Testing/Temporary/LastTest.log
          retention-days: 7
