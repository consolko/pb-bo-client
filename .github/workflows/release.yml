name: PocketBook release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag, e.g. v1.1.0 (leave empty for a build only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pocketbook-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/desktop.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BO_SDK_COMMIT: 754e436c7c24b4e2695154e2efffbf7447b4130e
      BO_IMAGE: ghcr.io/fstanis/pocketbook-sdk-qt6-builder@sha256:4015337a8c57c56b54239861e41487922b49779b0e0a277637ae53e311103344
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          BO_TAG: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          if [[ -n "$BO_TAG" ]]; then
            if [[ ! "$BO_TAG" =~ ^v(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]{0,5})$ ]]; then
              echo 'OTA releases require a stable tag, such as v1.1.0' >&2
              exit 1
            fi
            echo "BO_VERSION=${BO_TAG#v}" >> "$GITHUB_ENV"
          else
            BO_VERSION=$(sed -n 's/^set(BOOKORBIT_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt)
            test -n "$BO_VERSION"
            echo "BO_VERSION=$BO_VERSION" >> "$GITHUB_ENV"
          fi
      - name: Check out pinned SDK
        uses: actions/checkout@v4
        with:
          repository: fstanis/pocketbook-sdk-qt6
          ref: ${{ env.BO_SDK_COMMIT }}
          path: .pocketbook-sdk
          submodules: true
          persist-credentials: false
      - name: Build ARM Release
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e BO_VERSION \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$GITHUB_WORKSPACE/.pocketbook-sdk:/sdk:ro" \
            -w /src "$BO_IMAGE" bash -euc '
              cmake -S . -B build/pocketbook \
                -DPOCKETBOOK_QT_SDK=/sdk \
                -DCMAKE_BUILD_TYPE=Release \
                -DBOOKORBIT_CHECKS=OFF \
                -DBOOKORBIT_VERSION="$BO_VERSION" \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
              cmake --build build/pocketbook --target bookorbit -j2
            '
      - name: Verify and package
        run: |
          mkdir -p artifacts
          cp build/pocketbook/bookorbit.app artifacts/
          readelf -h artifacts/bookorbit.app | tee artifacts/elf.txt
          readelf -A artifacts/bookorbit.app | tee -a artifacts/elf.txt
          grep -q 'Class:.*ELF32' artifacts/elf.txt
          grep -q 'Machine:.*ARM' artifacts/elf.txt
          grep -q 'Tag_CPU_arch: v7' artifacts/elf.txt
          if grep -q 'Tag_ABI_VFP_args:.*VFP registers' artifacts/elf.txt; then
            echo 'Hard-float ABI is incompatible with the target firmware' >&2
            exit 1
          fi
          jq -e 'length > 0 and all(.[];
            (.command | contains("-DNDEBUG")) and
            ((.command | contains("CMakeFiles/bookorbit.dir/") | not) or (.command | contains("-DPOCKETBOOK_DEVICE"))) and
            (.command | contains("BOOKORBIT_TEST_HTTP") | not))' \
            build/pocketbook/compile_commands.json
          git archive --format=tar HEAD -o artifacts/source.tar
          jq -n --arg commit "$GITHUB_SHA" --arg sdk "$BO_SDK_COMMIT" \
            --arg builder "$BO_IMAGE" \
            '{commit: $commit, sdkCommit: $sdk, builder: $builder,
              target: "PB634 / U634.6.10.3425", buildType: "Release",
              checks: false, testHTTP: false, installed: false,
              validation: "Desktop CTest and ARM ELF checks; no emulator or physical-device run"}' \
            > artifacts/release.json
          cd artifacts
          sha256sum bookorbit.app source.tar release.json elf.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bookorbit-pb634-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bookorbit-pb634-${{ github.sha }}
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BO_TAG: ${{ inputs.version || github.ref_name }}
          BO_SIGNING_KEY: ${{ secrets.BOOKORBIT_UPDATE_SIGNING_KEY }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$BO_TAG"; then
            test "$(git rev-list -n 1 "refs/tags/$BO_TAG")" = "$GITHUB_SHA" || {
              echo 'The release tag points to a different source commit' >&2
              exit 1
            }
          fi
          (cd artifacts && sha256sum -c SHA256SUMS)
          test -n "$BO_SIGNING_KEY" || { echo 'Configure the release signing key before creating OTA releases' >&2; exit 1; }
          umask 077
          BO_KEY_FILE="$RUNNER_TEMP/bookorbit-signing.pem"
          trap 'rm -f "$BO_KEY_FILE"' EXIT
          printf '%s\n' "$BO_SIGNING_KEY" > "$BO_KEY_FILE"
          python3 tools/package_release.py \
            --client artifacts/bookorbit.app \
            --key "$BO_KEY_FILE" --commit "$GITHUB_SHA" --expect-version "$BO_TAG" \
            --source-sha256 "$(sha256sum artifacts/source.tar | cut -d' ' -f1)" \
            --output "$RUNNER_TEMP/ota-package"
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          PocketBook PB634 / U634.6.10.3425 build.

          Download bookorbit-pb634.zip and verify SHA256SUMS. The same signed ZIP
          supports USB installation and subsequent in-app updates. Close BookOrbit,
          copy bookorbit.app into applications/, keep existing application data,
          safely eject USB and open BookOrbit. In-app installation replaces this
          one file and closes BookOrbit; reopen it from the applications menu.
          No previous version or automatic rollback is retained.

          Desktop tests and ARM ELF checks passed. This CI build has not been run
          in pbemu or accepted on a physical PB634. Review and test before publishing.
          EOF
          cd "$RUNNER_TEMP/ota-package"
          gh release create "$BO_TAG" bookorbit-pb634.zip SHA256SUMS \
            --target "$GITHUB_SHA" --draft --title "BookOrbit $BO_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
