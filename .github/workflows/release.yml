name: PocketBook release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag, e.g. v0.1.0 (leave empty for a build only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pocketbook-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/desktop.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BO_SDK_COMMIT: 754e436c7c24b4e2695154e2efffbf7447b4130e
      BO_IMAGE: ghcr.io/fstanis/pocketbook-sdk-qt6-builder@sha256:4015337a8c57c56b54239861e41487922b49779b0e0a277637ae53e311103344
    steps:
      - name: Validate release version
        env:
          BO_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$BO_VERSION" && ! "$BO_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'Use a version such as v0.1.0 or v0.1.0-rc.1' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned SDK
        uses: actions/checkout@v4
        with:
          repository: fstanis/pocketbook-sdk-qt6
          ref: ${{ env.BO_SDK_COMMIT }}
          path: .pocketbook-sdk
          submodules: true
          persist-credentials: false
      - name: Build ARM Release
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$GITHUB_WORKSPACE/.pocketbook-sdk:/sdk:ro" \
            -w /src "$BO_IMAGE" bash -euc '
              cmake -S . -B build/pocketbook \
                -DPOCKETBOOK_QT_SDK=/sdk \
                -DCMAKE_BUILD_TYPE=Release \
                -DBOOKORBIT_CHECKS=OFF \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
              cmake --build build/pocketbook --target bookorbit -j2
            '
      - name: Verify and package
        run: |
          mkdir -p artifacts
          cp build/pocketbook/bookorbit.app artifacts/
          readelf -h artifacts/bookorbit.app | tee artifacts/elf.txt
          readelf -A artifacts/bookorbit.app | tee -a artifacts/elf.txt
          grep -q 'Class:.*ELF32' artifacts/elf.txt
          grep -q 'Machine:.*ARM' artifacts/elf.txt
          grep -q 'Tag_CPU_arch: v7' artifacts/elf.txt
          if grep -q 'Tag_ABI_VFP_args:.*VFP registers' artifacts/elf.txt; then
            echo 'Hard-float ABI is incompatible with the target firmware' >&2
            exit 1
          fi
          jq -e 'length > 0 and all(.[];
            (.command | contains("-DNDEBUG")) and
            (.command | contains("-DPOCKETBOOK_DEVICE")) and
            (.command | contains("BOOKORBIT_TEST_HTTP") | not))' \
            build/pocketbook/compile_commands.json
          git archive --format=tar HEAD -o artifacts/source.tar
          jq -n --arg commit "$GITHUB_SHA" --arg sdk "$BO_SDK_COMMIT" \
            --arg builder "$BO_IMAGE" \
            '{commit: $commit, sdkCommit: $sdk, builder: $builder,
              target: "PB634 / U634.6.10.3425", buildType: "Release",
              checks: false, testHTTP: false, installed: false,
              validation: "Desktop CTest and ARM ELF checks; no emulator or physical-device run"}' \
            > artifacts/release.json
          cd artifacts
          sha256sum bookorbit.app source.tar release.json elf.txt > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: bookorbit-pb634-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bookorbit-pb634-${{ github.sha }}
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BO_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$BO_TAG"; then
            test "$(git rev-list -n 1 "refs/tags/$BO_TAG")" = "$GITHUB_SHA" || {
              echo 'The release tag points to a different source commit' >&2
              exit 1
            }
          fi
          cd artifacts
          sha256sum -c SHA256SUMS
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          PocketBook PB634 / U634.6.10.3425 build.

          Download bookorbit-pb634.zip and verify it against SHA256SUMS, then extract it.
          The archive contains bookorbit.app, release.json with the toolchain,
          elf.txt and checksums for the extracted files. Source code is not included.

          Desktop tests and ARM ELF checks passed. This build has not been run in
          pbemu or accepted on a physical PB634. Review and test before publishing.
          EOF
          # GitHub release assets reject the .app extension; ZIP also preserves executable mode.
          chmod +x bookorbit.app
          sha256sum bookorbit.app release.json elf.txt > SHA256SUMS
          zip "$RUNNER_TEMP/bookorbit-pb634.zip" bookorbit.app SHA256SUMS release.json elf.txt
          cd "$RUNNER_TEMP"
          sha256sum bookorbit-pb634.zip > SHA256SUMS
          gh release create "$BO_TAG" bookorbit-pb634.zip SHA256SUMS \
            --target "$GITHUB_SHA" --draft --title "BookOrbit $BO_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
